# Save this ONE file as: .github/workflows/build.yml
# Generates the complete SwiftUI project and builds an unsigned IPA.
# Optional development signing uses repository secrets only inside the signing step.

name: Build AI Hub iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.personal.aihub' }}
  HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}

jobs:
  build-ios:
    name: Build with Xcode 26 • iOS 16.4+
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION_OUTPUT"
          XCODE_VERSION_LINE="${XCODE_VERSION_OUTPUT%%$'\n'*}"
          case "$XCODE_VERSION_LINE" in
            "Xcode 26"|"Xcode 26."*) ;;
            *) echo "Expected Xcode 26 on the macos-26 runner, but found: $XCODE_VERSION_LINE" >&2; exit 1 ;;
          esac

      - name: Generate app project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf GeneratedApp
          mkdir -p GeneratedApp/Sources GeneratedApp/artifacts

          cat > GeneratedApp/project.yml <<'PROJECT_YAML'
          name: AIHub
          options:
            minimumXcodeGenVersion: 2.38.0
            deploymentTarget:
              iOS: "16.4"
          packages:
            ZIPFoundation:
              url: https://github.com/weichsel/ZIPFoundation.git
              exactVersion: 0.9.19
            MarkdownUI:
              url: https://github.com/gonzalezreal/swift-markdown-ui.git
              exactVersion: 2.4.1
            BlakeHash:
              url: https://github.com/trancee/blake-hash.git
              exactVersion: 1.1.0
          settings:
            base:
              SWIFT_VERSION: 5.0
              IPHONEOS_DEPLOYMENT_TARGET: 16.4
              CURRENT_PROJECT_VERSION: 16
              MARKETING_VERSION: 2.2.1
              CODE_SIGN_STYLE: Automatic
          targets:
            AIHub:
              type: application
              platform: iOS
              deploymentTarget: "16.4"
              sources:
                - path: Sources
              dependencies:
                - package: ZIPFoundation
                - package: MarkdownUI
                - package: BlakeHash
              settings:
                base:
                  PRODUCT_NAME: AIHub
                  PRODUCT_BUNDLE_IDENTIFIER: com.personal.aihub
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: AI Hub
                  INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
                  INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
                  INFOPLIST_KEY_UIFileSharingEnabled: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_NSCameraUsageDescription: Scan multi-page documents for local OCR and AI analysis.
                  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select images for AI analysis and editing.
                  INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save AI-generated images to your photo library.
                  INFOPLIST_KEY_NSMicrophoneUsageDescription: Record voice questions for transcription in AI Hub.
                  INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Convert your spoken questions into text using Apple Speech Recognition.
                  TARGETED_DEVICE_FAMILY: 1
                  SUPPORTS_MACCATALYST: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
              scheme:
                testTargets: []
                gatherCoverageData: false
          PROJECT_YAML

          # Keep the complete app source inside this one workflow, but gzip it because GitHub
          # ignores workflow files larger than 500 KB before creating a run.
          cat > GeneratedApp/AIHubApp.swift.gz.b64 <<'SWIFT_SOURCE_GZIP_BASE64'
