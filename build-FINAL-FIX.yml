              {"filename":"icon-80.png",   "idiom":"iphone", "scale":"2x", "size":"40x40"},
              {"filename":"icon-120.png",  "idiom":"iphone", "scale":"3x", "size":"40x40"},
              {"filename":"icon-120.png",  "idiom":"iphone", "scale":"2x", "size":"60x60"},
              {"filename":"icon-180.png",  "idiom":"iphone", "scale":"3x", "size":"60x60"},
              {"filename":"icon-1024.png", "idiom":"ios-marketing", "scale":"1x", "size":"1024x1024"}
            ],
            "info": {"author":"xcode","version":1}
          }
          APPICON_JSON

          python3 - <<'ICON_PY'
          import struct, zlib
          from pathlib import Path
          out = Path("GeneratedApp/Sources/Assets.xcassets/AppIcon.appiconset")
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          def make_icon(size):
              rows = bytearray()
              for y in range(size):
                  rows.append(0)
                  for x in range(size):
                      u, v = x / max(1, size - 1), y / max(1, size - 1)
                      glow = max(0.0, 1.0 - ((u - .72) ** 2 + (v - .18) ** 2) ** .5 * 1.55)
                      r, g, b = int(43 + 35*u + 25*glow), int(38 + 72*v + 90*glow), int(145 + 74*u + 28*glow)
                      dx, dy = abs(x - size*.5), abs(y - size*.48)
                      star = (dx/(size*.055) + dy/(size*.29) < 1) or (dx/(size*.29) + dy/(size*.055) < 1)
                      dot1 = (x-size*.76)**2 + (y-size*.70)**2 < (size*.035)**2
                      dot2 = (x-size*.25)**2 + (y-size*.25)**2 < (size*.022)**2
                      if star or dot1 or dot2: r, g, b = 255, 255, 255
                      rows.extend((r, g, b, 255))
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(rows), 9)) + chunk(b"IEND", b"")
          for size in (40, 58, 60, 80, 87, 120, 180, 1024):
              (out / f"icon-{size}.png").write_bytes(make_icon(size))
          ICON_PY

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode project and resolve packages
        shell: bash
        working-directory: GeneratedApp
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project AIHub.xcodeproj -scheme AIHub

      - name: Build unsigned device IPA
        shell: bash
        working-directory: GeneratedApp
        run: |
          set -euo pipefail
          xcodebuild \
            -project AIHub.xcodeproj \
            -scheme AIHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-Unsigned \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          APP_PATH="DerivedData-Unsigned/Build/Products/Release-iphoneos/AIHub.app"
          test -d "$APP_PATH"
          rm -rf artifacts/Payload
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/AIHub.app
          (cd artifacts && zip -qry AIHub-unsigned.ipa Payload)
          rm -rf artifacts/Payload

      - name: Install optional signing certificate and profile
        if: env.HAS_SIGNING == 'true'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASS="${KEYCHAIN_PASSWORD:-aihub-temporary-keychain}"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/build_profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/aihub-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          chmod 600 "$CERT_PATH" "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          case "$PROFILE_APP_ID" in
            "$PROFILE_TEAM_ID.$BUNDLE_ID"|"$PROFILE_TEAM_ID.*") ;;
            *) echo "Provisioning profile does not match BUNDLE_ID=$BUNDLE_ID" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build optional signed development IPA
        if: env.HAS_SIGNING == 'true'
        shell: bash
        working-directory: GeneratedApp
        run: |
          set -euo pipefail
          rm -rf AIHub.xcarchive ExportedIPA
          xcodebuild archive \
            -project AIHub.xcodeproj \
            -scheme AIHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath AIHub.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$PROFILE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

          cat > ExportOptions.plist <<EXPORT_PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$PROFILE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EXPORT_PLIST
          xcodebuild -exportArchive -archivePath AIHub.xcarchive -exportPath ExportedIPA -exportOptionsPlist ExportOptions.plist
          cp ExportedIPA/*.ipa artifacts/AIHub-signed.ipa

      - name: Remove temporary signing material
        if: always() && env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_profile.mobileprovision" "$RUNNER_TEMP/build_profile.plist"

      - name: Write build information
        if: always()
        shell: bash
        run: |
          mkdir -p GeneratedApp/artifacts
          cat > GeneratedApp/artifacts/INSTALL.txt <<'TXT'
          AI Hub 2.1.0 (Build 14) • iOS 16.4+

          AIHub-unsigned.ipa must be signed before installation.
          AIHub-signed.ipa, when present, uses the development profile supplied in repository secrets.
          Open Settings in the app and add your own provider keys.

          Attachment controls:
          - Photo icon opens Photos directly.
          - Document icon opens Files/iCloud directly.
          - Scanner icon captures corrected multi-page documents and assembles a native PDF.
          - Supported: PDF, XLSX/XLSM, DOCX, PPTX, text/CSV/JSON/Markdown, and common images.
          - iOS 26 uses structured Vision document recognition; iOS 16.4–25 uses enhanced Vision OCR fallback.
          - File selection uses a reliable UIKit as-copy picker; rows remain selectable and unsupported extensions receive an in-app explanation.
          - Extra free-tier providers: Z.AI GLM Flash, Mistral Free mode, Cloudflare Workers AI, and SambaNova Cloud; Vercel AI Gateway is integrated with live credits.
          - Smart image routing uses Cloudflare FLUX first (Workers AI free daily allocation), then Pollinations when Pollen is available.
          - Precise edit prompts preserve unrequested layout, identity, branding, and text.
          - PDF/document Auto routing prioritizes native PDF and vision providers; text-only Groq is a late OCR fallback.
          - HTTP 413 token/TPM failures automatically fall back in Auto mode; Groq uses a smaller output reservation and compact vision input.
          - Smart, Deep Analysis, and Web Research modes add task-aware routing, consistency checks, and provider-specific context/history budgets.
          - Cloudflare uses the REST API directly; no Worker template deployment is required.
          - Strict document grounding is enabled by default: weak scanned-PDF OCR blocks text-only routes, prior AI claims are excluded, and unreferenced PDF answers are rejected.
          - In Auto + Deep Analysis, and in grounded Web Research when enabled, a second configured provider independently checks claims and returns a corrected, cited final answer.
          - Cloudflare and Z.AI can receive multiple compact PDF page images; Gemini/OpenRouter retain native PDF paths.
          - Voice input uses Apple Speech Recognition with selectable Arabic/English locale, plus a spoken-answer button using AVSpeechSynthesizer.
          - Microphone and Speech Recognition permissions are requested only when voice input is first used.
          - Hidden chain-of-thought, <think> blocks, reasoning_content, internal constraint checks, and provider self-audits are removed or rejected before display.
          - Version 1.7 adds persistent Knowledge Projects with multi-file local indexing and hybrid BM25 + semantic retrieval; relevant passages carry exact [K#] citations.
          - Version 1.7.1 makes Tavily free-plan compatible by using basic search and omitting the enterprise-only safe_search request field.
          - Version 1.8 adds Web Project output: generated HTML is saved as a real persistent local project and opens immediately in a dedicated WKWebView Web Preview tab.
          - Version 1.9 adds Vercel AI Gateway as a native provider at ai-gateway.vercel.sh with Keychain storage, live model discovery, and official GET /v1/credits balance/total_used monitoring against the recurring free $5 allowance.
          - Vercel usage shows exact live balance, lifetime total_used, a free-tier $5 progress bar, a paid/account-credit mode that avoids a false $5 cap, manual refresh, and automatic refresh after Vercel inference.
          - Version 1.9 adds SambaNova Cloud with live model discovery, a conservative free-tier daily guard, Auto fallback, and exact remaining minute/day request quotas read from official x-ratelimit response headers.
          - Web Project follow-ups can now target the selected saved project: AI Hub supplies its complete current files under an explicit untrusted-source edit contract and applies only validated replacements/deletions to the same UUID.
          - Website updates are staged, validated as a complete project, and swapped atomically with rollback; unchanged source, preview/publish metadata, exports, and Cloudflare project identity are preserved.
          - Web Preview has an Edit in Chat action, Chat shows the current New/Update target, explicit new-site wording starts a separate project, and successful same-project edits force a fresh local preview.
          - Version 2.0 replaces the single endless transcript with persistent independent conversations, New Chat, history search, automatic titles, rename, pin, archive, delete, migration of existing messages, and per-conversation Web/Knowledge links.
          - Message controls add true OpenAI-compatible SSE streaming, Stop, regenerate with another provider, edit-in-branch, branch from any message, copy, listen, share, and professional export without exposing streamed reasoning fields.
          - Agent Mode presents a concrete action plan for approval before execution, can combine local tools, Knowledge, live research, exports, and explicit Remote MCP tools, and never claims unconfirmed publishing or connector actions.
          - Compare / Consensus obtains independent grounded answers from two configured providers and asks an eligible reviewer to synthesize a stronger final answer; failed synthesis preserves both drafts transparently.
          - Global Search finds local conversations/messages, Knowledge documents, Web Projects, and source files and navigates directly to the selected result.
          - Provider Control Center summarizes configured models, daily guards, learned routing, capabilities, live Vercel credits, SambaNova quotas, and dynamic catalogs.
          - Web Studio adds automatic complete-project revisions before AI/manual edits, changed/added/deleted summaries, side-by-side source comparison, revision preview, reversible rollback, editable source, asset import, and file deletion.
          - Web Preview enables inline media and Web Audio, unlocks audio contexts on the first user gesture, supports imported audio/video/image/font assets, preserves native JavaScript alert/confirm/prompt controls, and captures console/error/promise diagnostics.
          - Generated websites now require semantic 44×44 touch targets, real event handlers, safe pointer-events/z-index, viewport correction, and gesture-safe audio initialization; the preview reports small or blocked controls in Web Console.
          - Live Voice mode listens, sends after a final speech result, reads the answer aloud, and resumes listening until the user turns it off.
          - Remote MCP supports HTTPS JSON-RPC initialize, tools/list, explicit approved tools/call, optional Bearer authentication, session IDs, JSON/SSE responses, and untrusted-result grounding. Storage remains local-only as selected; API and connector tokens stay in Keychain.
          - Web Project supports both one-file index.html sites and complete multi-file HTML/CSS/JavaScript/JSON/SVG projects with strict file-block parsing, UTF-8/type/size/path validation, and index.html normalization.
          - Web Preview includes project switching, refresh, source-file browsing, local HTML sharing, full ZIP export, project deletion, and remembered publication metadata.
          - Optional Cloudflare Pages Direct Upload creates or reuses a Pages project, computes Wrangler-compatible BLAKE3 asset hashes, uploads assets, upserts hashes, deploys the manifest, and returns a public HTTPS pages.dev link.
          - Cloudflare publishing reuses the saved Workers AI Account ID/token when possible, supports a dedicated Pages token, tests authorization, and identifies Account → Cloudflare Pages → Edit as the required permission.
          - Local website creation and preview never require publishing; public publishing happens only when the user taps Publish.
          - Current/historical currency questions bypass the language model and use keyless Frankfurter structured rates with a second no-key fallback, deterministic conversion, data date, source link, and refusal to estimate on failure.
          - Web Research uses a user-supplied free Tavily key, freshness controls, official-source expansion, deduplication, clickable [S#] sources, and strict citation rejection.
          - Evidence cards show source excerpts and deterministic citation coverage; Auto Deep/Research can run independent claim-level correction through a second configured provider.
          - Smart Router 2.0 learns success, latency, and task type, with a five-minute circuit breaker after repeated failures.
          - Ambiguous report/plan/comparison requests can ask concise clarifying questions before spending an API call.
          - A deterministic local calculator supports explicit arithmetic, while spreadsheet/CSV attachments receive a local structural data profile.
          - Retrieved file/web content is quoted as untrusted data and suspicious embedded prompt instructions are marked instead of executed.
          - Output can be selected before sending: Answer, Markdown Table, Excel, CSV, PDF, Word, or Web Project; prompt keywords can also infer the requested type.
          - Every assistant answer has an Export menu for XLSX, CSV, PDF, DOCX, TXT, and Markdown.
          - Professional XLSX exports support multiple sheets, Arabic RTL, styled headers, frozen first row, filters, numeric/percent cells, safe formulas, and useful widths.
          - PDF and DOCX exports preserve Arabic direction, headings, lists, code, and tables; generated files persist under Documents/AIHubExports and can be shared.
          - Maximum imported file size: 50 MB.
          TXT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-iOS-${{ github.run_number }}
          path: GeneratedApp/artifacts/
          if-no-files-found: error
          retention-days: 14
