                                  .frame(maxWidth: .infinity)
                              }
                              .buttonStyle(.borderedProminent)
                              .disabled(prompt.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty || isWorking)

                              if let outputImage {
                                  VStack(spacing: 10) {
                                      Image(uiImage: outputImage)
                                          .resizable().scaledToFit().clipShape(RoundedRectangle(cornerRadius: 16))
                                      HStack {
                                          Button { saveToPhotos(outputImage) } label: { Label("Save", systemImage: "square.and.arrow.down") }
                                          Spacer()
                                          Button { shareImage = ShareImage(image: outputImage) } label: { Label("Share", systemImage: "square.and.arrow.up") }
                                      }
                                      .buttonStyle(.bordered)
                                  }
                              }

                              Text("Generation uses Pollinations (default: \(settings.imageModel)). AI editing uses \(settings.imageEditModel) and a Pollinations publishable key. Free quotas and model availability can change.")
                                  .font(.caption).foregroundStyle(.secondary)
                          }
                          .padding()
                      }
                      .navigationTitle("Images / الصور")
                  }
                  .onChange(of: sourceItem) { item in loadSource(item) }
                  .sheet(item: $shareImage) { item in ShareSheet(items: [item.image]) }
                  .alert("Image Error", isPresented: $showError) { Button("OK", role: .cancel) {} } message: { Text(errorMessage) }
              }

              private func loadSource(_ item: PhotosPickerItem?) {
                  guard let item else { return }
                  Task {
                      defer { sourceItem = nil }
                      do {
                          guard let data = try await item.loadTransferable(type: Data.self), let image = UIImage(data: data) else {
                              throw ServiceError("Could not load source image")
                          }
                          sourceImage = image
                          sourceData = image.jpegData(compressionQuality: 0.9) ?? data
                      } catch { present(error.localizedDescription) }
                  }
              }

              private func runImageAI() {
                  let clean = prompt.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !clean.isEmpty else { return }
                  guard usage.canSend(limit: settings.localDailyLimit) else {
                      present("Your local daily limit is reached. Change it in Settings or wait until tomorrow.")
                      return
                  }
                  isWorking = true
                  Task {
                      defer { isWorking = false }
                      do {
                          if let data = sourceData {
                              outputImage = try await ImageAIService.shared.edit(imageData: data, prompt: clean, model: settings.imageEditModel, apiKey: settings.pollinationsKey)
                          } else {
                              outputImage = try await ImageAIService.shared.generate(prompt: clean, model: settings.imageModel, apiKey: settings.pollinationsKey)
                          }
                          usage.record(label: "pollinations")
                      } catch { present(error.localizedDescription) }
                  }
              }

              private func saveToPhotos(_ image: UIImage) {
                  Task {
                      do {
                          let status = await PHPhotoLibrary.requestAuthorization(for: .addOnly)
                          guard status == .authorized || status == .limited else { throw ServiceError("Photo Library permission was denied") }
                          try await PHPhotoLibrary.shared().performChanges {
                              PHAssetChangeRequest.creationRequestForAsset(from: image)
                          }
                      } catch { present(error.localizedDescription) }
                  }
              }

              private func present(_ message: String) { errorMessage = message; showError = true }
          }

          struct ShareImage: Identifiable {
              let id = UUID()
              let image: UIImage
          }

          struct ShareSheet: UIViewControllerRepresentable {
              let items: [Any]
              func makeUIViewController(context: Context) -> UIActivityViewController { UIActivityViewController(activityItems: items, applicationActivities: nil) }
              func updateUIViewController(_ uiViewController: UIActivityViewController, context: Context) {}
          }

          struct SettingsView: View {
              @EnvironmentObject private var settings: AppSettings
              @EnvironmentObject private var usage: UsageLedger

              @State private var geminiKey = ""
              @State private var groqKey = ""
              @State private var openRouterKey = ""
              @State private var siliconKey = ""
              @State private var customKey = ""
              @State private var pollinationsKey = ""
              @State private var saved = false

              var body: some View {
                  NavigationStack {
                      Form {
                          Section("Routing") {
                              Picker("Provider", selection: $settings.selectedProvider) {
                                  ForEach(ProviderID.allCases) { provider in Text(provider.title).tag(provider) }
                              }
                              Stepper("Local daily cap: \(settings.localDailyLimit)", value: $settings.localDailyLimit, in: 1...5000, step: 25)
                              LabeledContent("Used today", value: "\(usage.total)")
                              Text("Auto tries configured providers in order and falls back after quota, capacity, or API errors. This counter is an on-device safety cap; provider quotas are enforced by each service.")
                                  .font(.caption).foregroundStyle(.secondary)
                          }

                          providerSection(
                              title: "Google Gemini — text + vision",
                              key: $geminiKey,
                              model: $settings.geminiModel,
                              note: "Gemini 3.7 Flash currently has a free API tier in eligible regions. Exact RPM/RPD varies by model/project. Free-tier prompts may be used to improve Google products."
                          )

                          providerSection(
                              title: "Groq — very fast",
                              key: $groqKey,
                              model: $settings.groqModel,
                              note: "The free plan is rate-limited by model. The default Qwen 3.6 model supports text and up to three images; check your Groq Limits page for the live quota."
                          )

                          providerSection(
                              title: "OpenRouter — rotating free models",
                              key: $openRouterKey,
                              model: $settings.openRouterModel,
                              note: "openrouter/free automatically chooses a compatible free model. New accounts are normally limited across free models; availability and the free roster rotate."
                          )

                          providerSection(
                              title: "SiliconFlow / SiliconCloud",
                              key: $siliconKey,
                              model: $settings.siliconModel,
                              note: "Use a model currently marked $0 in the SiliconFlow console. The default Qwen3-8B is text-only; free models and fixed rate limits can change."
                          )

                          Section("Pollinations — image generation/editing") {
                              SecureField("Publishable app key (pk_…)", text: $pollinationsKey)
                                  .textInputAutocapitalization(.never).autocorrectionDisabled()
                              TextField("Generation model", text: $settings.imageModel)
                                  .textInputAutocapitalization(.never).autocorrectionDisabled()
                              TextField("Editing model", text: $settings.imageEditModel)
                                  .textInputAutocapitalization(.never).autocorrectionDisabled()
                              Text("A key may be optional for light image generation, but editing requires a publishable app key and may consume free Pollen/credits. Never put a secret sk_ server key in an iPhone app.")
                                  .font(.caption).foregroundStyle(.secondary)
                          }

                          Section("Custom OpenAI-compatible API") {
                              TextField("Base URL", text: $settings.customBaseURL)
                                  .textInputAutocapitalization(.never).autocorrectionDisabled()
                              TextField("Model", text: $settings.customModel)
                                  .textInputAutocapitalization(.never).autocorrectionDisabled()
                              SecureField("API key (optional)", text: $customKey)
                                  .textInputAutocapitalization(.never).autocorrectionDisabled()
                          }

                          Section("Assistant") {
                              TextField("System prompt", text: $settings.systemPrompt, axis: .vertical).lineLimit(3...9)
                          }

                          Section {
                              Button {
                                  saveKeys()
                              } label: {
                                  HStack { Spacer(); Label(saved ? "Saved" : "Save Keys", systemImage: saved ? "checkmark.circle.fill" : "key.fill"); Spacer() }
                              }
                          } footer: {
                              Text("Keys are stored in iOS Keychain, not UserDefaults or the build file. Client-side keys are suitable for a personal app only; use your own backend before distributing the app to other people. Free does not mean unlimited, permanent, or private.")
                          }

                          Section("Current free-tier reality") {
                              Text("Best stack: Gemini for multimodal/long documents, Groq for speed, OpenRouter for rotating free models, SiliconFlow for selected $0 open models, and Pollinations for images. Cerebras currently offers a time-limited credit trial rather than a renewing always-free API tier, so it is not a default provider here.")
                                  .font(.footnote)
                          }
                      }
                      .navigationTitle("Settings / الإعدادات")
                  }
                  .onAppear(perform: loadKeys)
              }

              @ViewBuilder
              private func providerSection(title: String, key: Binding<String>, model: Binding<String>, note: String) -> some View {
                  Section {
                      SecureField("API key", text: key)
                          .textInputAutocapitalization(.never).autocorrectionDisabled()
                      TextField("Model ID", text: model)
                          .textInputAutocapitalization(.never).autocorrectionDisabled()
                      Text(note).font(.caption).foregroundStyle(.secondary)
                  } header: {
                      Text(title)
                  }
              }

              private func loadKeys() {
                  geminiKey = settings.key(for: .gemini)
                  groqKey = settings.key(for: .groq)
                  openRouterKey = settings.key(for: .openRouter)
                  siliconKey = settings.key(for: .siliconFlow)
                  customKey = settings.key(for: .custom)
                  pollinationsKey = settings.pollinationsKey
              }

              private func saveKeys() {
                  settings.setKey(geminiKey, for: .gemini)
                  settings.setKey(groqKey, for: .groq)
                  settings.setKey(openRouterKey, for: .openRouter)
                  settings.setKey(siliconKey, for: .siliconFlow)
                  settings.setKey(customKey, for: .custom)
                  settings.setPollinationsKey(pollinationsKey)
                  saved = true
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) { saved = false }
              }
          }
          SWIFT_SOURCE

          mkdir -p GeneratedApp/Sources/Assets.xcassets/AppIcon.appiconset
          cat > GeneratedApp/Sources/Assets.xcassets/Contents.json <<'ASSET_ROOT'
          {"info":{"author":"xcode","version":1}}
          ASSET_ROOT
          cat > GeneratedApp/Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'APPICON_JSON'
          {
            "images": [
              {"filename":"icon-40.png",   "idiom":"iphone", "scale":"2x", "size":"20x20"},
              {"filename":"icon-60.png",   "idiom":"iphone", "scale":"3x", "size":"20x20"},
              {"filename":"icon-58.png",   "idiom":"iphone", "scale":"2x", "size":"29x29"},
              {"filename":"icon-87.png",   "idiom":"iphone", "scale":"3x", "size":"29x29"},
              {"filename":"icon-80.png",   "idiom":"iphone", "scale":"2x", "size":"40x40"},
              {"filename":"icon-120.png",  "idiom":"iphone", "scale":"3x", "size":"40x40"},
              {"filename":"icon-120.png",  "idiom":"iphone", "scale":"2x", "size":"60x60"},
              {"filename":"icon-180.png",  "idiom":"iphone", "scale":"3x", "size":"60x60"},
              {"filename":"icon-1024.png", "idiom":"ios-marketing", "scale":"1x", "size":"1024x1024"}
            ],
            "info": {"author":"xcode","version":1}
          }
          APPICON_JSON
          python3 - <<'ICON_PY'
          import struct, zlib
          from pathlib import Path

          out = Path("GeneratedApp/Sources/Assets.xcassets/AppIcon.appiconset")
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          def make_icon(size):
              rows = bytearray()
              for y in range(size):
                  rows.append(0)
                  for x in range(size):
                      u, v = x / max(1, size - 1), y / max(1, size - 1)
                      glow = max(0.0, 1.0 - ((u - .72) ** 2 + (v - .18) ** 2) ** .5 * 1.55)
                      r = int(43 + 35 * u + 25 * glow)
                      g = int(38 + 72 * v + 90 * glow)
                      b = int(145 + 74 * u + 28 * glow)
                      dx, dy = abs(x - size * .5), abs(y - size * .48)
                      star = (dx / (size * .055) + dy / (size * .29) < 1) or (dx / (size * .29) + dy / (size * .055) < 1)
                      dot1 = (x - size * .76) ** 2 + (y - size * .70) ** 2 < (size * .035) ** 2
                      dot2 = (x - size * .25) ** 2 + (y - size * .25) ** 2 < (size * .022) ** 2
                      if star or dot1 or dot2: r, g, b = 255, 255, 255
                      rows.extend((r, g, b, 255))
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(rows), 9)) + chunk(b"IEND", b"")
          for size in (40, 58, 60, 80, 87, 120, 180, 1024):
              (out / f"icon-{size}.png").write_bytes(make_icon(size))
          ICON_PY

      - name: Install XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode project and resolve packages
        shell: bash
        working-directory: GeneratedApp
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -resolvePackageDependencies \
            -project AIHub.xcodeproj \
            -scheme AIHub

      - name: Build unsigned device IPA
        shell: bash
        working-directory: GeneratedApp
        run: |
          set -euo pipefail
          xcodebuild \
            -project AIHub.xcodeproj \
            -scheme AIHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-Unsigned \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

          APP_PATH="DerivedData-Unsigned/Build/Products/Release-iphoneos/AIHub.app"
          test -d "$APP_PATH"
          rm -rf artifacts/Payload
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/AIHub.app
          (cd artifacts && zip -qry AIHub-unsigned.ipa Payload)
          rm -rf artifacts/Payload

      - name: Install optional signing certificate and profile
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' && env.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASS="${KEYCHAIN_PASSWORD:-aihub-temporary-keychain}"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/build_profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/aihub-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build optional signed development IPA
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' && env.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        shell: bash
        working-directory: GeneratedApp
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          rm -rf AIHub.xcarchive ExportedIPA

          xcodebuild archive \
            -project AIHub.xcodeproj \
            -scheme AIHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath AIHub.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$PROFILE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

          cat > ExportOptions.plist <<EXPORT_PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$PROFILE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EXPORT_PLIST

          xcodebuild -exportArchive \
            -archivePath AIHub.xcarchive \
            -exportPath ExportedIPA \
            -exportOptionsPlist ExportOptions.plist
          cp ExportedIPA/*.ipa artifacts/AIHub-signed.ipa

      - name: Write build information
        shell: bash
        working-directory: GeneratedApp
        run: |
          cat > artifacts/INSTALL.txt <<'TXT'
          AI Hub iOS 16.4+

          AIHub-unsigned.ipa must be signed with your own Apple ID/certificate before installation.
          If AIHub-signed.ipa exists, it was signed with the development profile supplied in GitHub Secrets.
          The target iPhone UDID must be included in that provisioning profile.

          Open the app, go to Settings, add your own API keys, verify model IDs in each provider console,
          then choose Auto Fallback or a specific provider. Keys are stored in iOS Keychain.
          TXT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-iOS-${{ github.run_number }}
          path: GeneratedApp/artifacts/
          if-no-files-found: error
          retention-days: 14
