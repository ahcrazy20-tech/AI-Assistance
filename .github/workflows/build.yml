          struct FilesView: View {
              @EnvironmentObject private var attachment: AttachmentStore
              @EnvironmentObject private var navigation: NavigationState
              @State private var showImporter = false
              @State private var previewText = ""
              @State private var fileName = ""
              @State private var errorMessage = ""
              @State private var showError = false

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 16) {
                          if attachment.isLoading { Spacer(); ProgressView("Importing and extracting…"); Spacer() }
                          else if previewText.isEmpty {
                              Spacer()
                              Image(systemName: "doc.text.magnifyingglass").font(.system(size: 52)).foregroundStyle(.indigo)
                              Text("Local Document Extraction").font(.title2.bold())
                              Text("PDF/OCR, XLSX, DOCX, PPTX, CSV, JSON, Markdown, text, and images. Maximum input size: 50 MB.")
