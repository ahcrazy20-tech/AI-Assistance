          SWIFT_SOURCE_GZIP_BASE64
          if base64 --decode GeneratedApp/AIHubApp.swift.gz.b64 > GeneratedApp/AIHubApp.swift.gz 2>/dev/null; then
            :
          else
            base64 -D GeneratedApp/AIHubApp.swift.gz.b64 > GeneratedApp/AIHubApp.swift.gz
          fi
