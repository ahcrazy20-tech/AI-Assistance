# ============================================================================
# AIHub — build.yml (GitHub Actions workflow) — النسخة النظيفة (من غير base64)
# الملفات AIHub.swift + project.yml + exportOptions.plist لازم تكون مرفوعة
# في الـ repo جنب بعض. ضع هذا الملف في: .github/workflows/build.yml
# ============================================================================
name: AIHub Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # --- فحص البناء (من غير توقيع) ---
      - name: Build (compile check)
        run: |
          xcodebuild clean build \
            -scheme AIHub \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # --- أرشفة + رفع TestFlight عند عمل Tag ---
      - name: Archive & Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -e
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PP_PATH" ~/Library/MobileDevice/"Provisioning Profiles"
          xcodegen generate
          xcodebuild archive -scheme AIHub -configuration Release \
            -archivePath "$RUNNER_TEMP/AIHub.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AIHub.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist exportOptions.plist
          echo -n "$APPSTORE_API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"
          cd "$RUNNER_TEMP/private_keys"
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/AIHub.ipa" \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID" --output-format normal
