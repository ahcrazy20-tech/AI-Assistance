              func generate(prompt: String, model: String, apiKey: String) async throws -> UIImage {
                  guard !apiKey.isEmpty else { throw ServiceError("Add a Pollinations publishable pk_ key in Settings.", kind: .configuration) }
                  guard let url = URL(string: "https://gen.pollinations.ai/v1/images/generations") else { throw ServiceError("Invalid generation endpoint") }
                  let body: [String: Any] = [
                      "prompt": String(prompt.prefix(12_000)),
