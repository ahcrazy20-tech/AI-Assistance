# Save this ONE file as: .github/workflows/build.yml
# It generates the complete SwiftUI project during GitHub Actions and builds an IPA.
# No API key is compiled into the app; add provider keys inside the app's Settings tab.
#
# Default output: unsigned IPA (sign/sideload it with your own Apple ID using AltStore,
# Sideloadly, or another legal personal-device signing method).
#
# Optional directly signed development IPA:
#   Repository variable: BUNDLE_ID (must match the provisioning profile)
#   Repository secrets: BUILD_CERTIFICATE_BASE64, P12_PASSWORD,
#                       BUILD_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD

name: Build AI Hub iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.personal.aihub' }}

jobs:
  build-ios:
    name: Build iOS 16.4 IPA
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the complete app project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf GeneratedApp
          mkdir -p GeneratedApp/Sources GeneratedApp/artifacts

          cat > GeneratedApp/project.yml <<'PROJECT_YAML'
          name: AIHub
          options:
            minimumXcodeGenVersion: 2.38.0
            deploymentTarget:
              iOS: "16.4"
          packages:
            ZIPFoundation:
              url: https://github.com/weichsel/ZIPFoundation.git
              from: 0.9.19
          settings:
            base:
              SWIFT_VERSION: 5.0
              IPHONEOS_DEPLOYMENT_TARGET: 16.4
              CURRENT_PROJECT_VERSION: 1
              MARKETING_VERSION: 1.0.0
              CODE_SIGN_STYLE: Automatic
          targets:
            AIHub:
              type: application
              platform: iOS
              deploymentTarget: "16.4"
              sources:
                - path: Sources
              dependencies:
                - package: ZIPFoundation
              settings:
                base:
                  PRODUCT_NAME: AIHub
                  PRODUCT_BUNDLE_IDENTIFIER: com.personal.aihub
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: AI Hub
                  INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select images for AI analysis and editing.
                  INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save AI-generated images to your photo library.
                  TARGETED_DEVICE_FAMILY: 1
                  SUPPORTS_MACCATALYST: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
              scheme:
                testTargets: []
                gatherCoverageData: false
          PROJECT_YAML

          cat > GeneratedApp/Sources/AIHubApp.swift <<'SWIFT_SOURCE'
          import Foundation
          import SwiftUI
          import UIKit
          import PhotosUI
          import Photos
          import UniformTypeIdentifiers
          import PDFKit
          import Vision
          import Security
          import ZIPFoundation

          // MARK: - Models

          enum ProviderID: String, CaseIterable, Identifiable, Codable {
              case auto, gemini, groq, openRouter, siliconFlow, custom

              var id: String { rawValue }

              var title: String {
                  switch self {
                  case .auto: return "Auto Fallback"
                  case .gemini: return "Google Gemini"
                  case .groq: return "Groq"
                  case .openRouter: return "OpenRouter Free"
                  case .siliconFlow: return "SiliconFlow"
                  case .custom: return "Custom OpenAI API"
                  }
              }

              var shortTitle: String {
                  switch self {
                  case .auto: return "Auto"
                  case .gemini: return "Gemini"
                  case .groq: return "Groq"
                  case .openRouter: return "OpenRouter"
                  case .siliconFlow: return "SiliconFlow"
                  case .custom: return "Custom"
                  }
              }
          }

          enum ChatRole: String, Codable {
              case user, assistant
          }

          struct ChatMessage: Identifiable, Codable, Equatable {
              var id = UUID()
              let role: ChatRole
              let text: String
              var provider: String? = nil
              var createdAt = Date()
          }

          struct InputAttachment: Identifiable {
              let id = UUID()
              let name: String
              let mimeType: String
              let extractedText: String
              let imageData: Data?

              var isImage: Bool { imageData != nil }
          }

          struct ExtractionResult {
              let name: String
              let mimeType: String
              let text: String
              let imageData: Data?
          }

          struct ChatResult {
              let text: String
              let provider: ProviderID
          }

          struct ServiceError: LocalizedError {
              let message: String
              let statusCode: Int?

              init(_ message: String, statusCode: Int? = nil) {
                  self.message = message
                  self.statusCode = statusCode
              }

              var errorDescription: String? {
                  if let statusCode { return "\(message) (HTTP \(statusCode))" }
                  return message
              }
          }

          // MARK: - Secure key storage

          enum KeychainStore {
              private static let service = "com.personal.aihub.keys"

              static func read(_ account: String) -> String {
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: service,
                      kSecAttrAccount as String: account,
                      kSecReturnData as String: true,
                      kSecMatchLimit as String: kSecMatchLimitOne
                  ]
                  var item: CFTypeRef?
                  guard SecItemCopyMatching(query as CFDictionary, &item) == errSecSuccess,
                        let data = item as? Data,
                        let value = String(data: data, encoding: .utf8) else { return "" }
                  return value
              }

              static func write(_ value: String, account: String) {
                  let base: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: service,
                      kSecAttrAccount as String: account
                  ]
                  if value.isEmpty {
                      SecItemDelete(base as CFDictionary)
                      return
                  }
                  let data = Data(value.utf8)
                  let changes: [String: Any] = [kSecValueData as String: data]
                  if SecItemUpdate(base as CFDictionary, changes as CFDictionary) == errSecItemNotFound {
                      var insert = base
                      insert[kSecValueData as String] = data
                      SecItemAdd(insert as CFDictionary, nil)
                  }
              }
          }

          // MARK: - App state

          @MainActor
          final class AppSettings: ObservableObject {
              private let defaults = UserDefaults.standard

              @Published var selectedProvider: ProviderID { didSet { defaults.set(selectedProvider.rawValue, forKey: "selectedProvider") } }
              @Published var geminiModel: String { didSet { defaults.set(geminiModel, forKey: "geminiModel") } }
              @Published var groqModel: String { didSet { defaults.set(groqModel, forKey: "groqModel") } }
              @Published var openRouterModel: String { didSet { defaults.set(openRouterModel, forKey: "openRouterModel") } }
              @Published var siliconModel: String { didSet { defaults.set(siliconModel, forKey: "siliconModel") } }
              @Published var customModel: String { didSet { defaults.set(customModel, forKey: "customModel") } }
              @Published var customBaseURL: String { didSet { defaults.set(customBaseURL, forKey: "customBaseURL") } }
              @Published var imageModel: String { didSet { defaults.set(imageModel, forKey: "imageModel") } }
              @Published var imageEditModel: String { didSet { defaults.set(imageEditModel, forKey: "imageEditModel") } }
              @Published var systemPrompt: String { didSet { defaults.set(systemPrompt, forKey: "systemPrompt") } }
              @Published var localDailyLimit: Int { didSet { defaults.set(localDailyLimit, forKey: "localDailyLimit") } }
              @Published private(set) var keyRevision = 0

              init() {
                  selectedProvider = ProviderID(rawValue: defaults.string(forKey: "selectedProvider") ?? "auto") ?? .auto
                  geminiModel = defaults.string(forKey: "geminiModel") ?? "gemini-3.7-flash"
                  groqModel = defaults.string(forKey: "groqModel") ?? "qwen/qwen3.6-27b"
                  openRouterModel = defaults.string(forKey: "openRouterModel") ?? "openrouter/free"
                  siliconModel = defaults.string(forKey: "siliconModel") ?? "Qwen/Qwen3-8B"
                  customModel = defaults.string(forKey: "customModel") ?? ""
                  customBaseURL = defaults.string(forKey: "customBaseURL") ?? "https://api.example.com/v1"
                  imageModel = defaults.string(forKey: "imageModel") ?? "zimage"
                  imageEditModel = defaults.string(forKey: "imageEditModel") ?? "kontext"
                  systemPrompt = defaults.string(forKey: "systemPrompt") ?? "You are a powerful personal AI assistant. Answer accurately in the user's language. When a document is attached, analyze only the supplied content and clearly state uncertainty."
                  let storedLimit = defaults.integer(forKey: "localDailyLimit")
                  localDailyLimit = storedLimit == 0 ? 200 : storedLimit
              }

              func key(for provider: ProviderID) -> String {
                  KeychainStore.read(provider.rawValue)
              }

              func setKey(_ value: String, for provider: ProviderID) {
                  KeychainStore.write(value.trimmingCharacters(in: .whitespacesAndNewlines), account: provider.rawValue)
                  keyRevision += 1
              }

              var pollinationsKey: String { KeychainStore.read("pollinations") }

              func setPollinationsKey(_ value: String) {
                  KeychainStore.write(value.trimmingCharacters(in: .whitespacesAndNewlines), account: "pollinations")
                  keyRevision += 1
              }

              func model(for provider: ProviderID) -> String {
                  switch provider {
                  case .gemini: return geminiModel
                  case .groq: return groqModel
                  case .openRouter: return openRouterModel
                  case .siliconFlow: return siliconModel
                  case .custom: return customModel
                  case .auto: return ""
                  }
              }

              func baseURL(for provider: ProviderID) -> String {
                  switch provider {
                  case .groq: return "https://api.groq.com/openai/v1"
                  case .openRouter: return "https://openrouter.ai/api/v1"
                  case .siliconFlow: return "https://api.siliconflow.com/v1"
                  case .custom: return customBaseURL
                  default: return ""
                  }
              }
          }

          @MainActor
          final class ChatStore: ObservableObject {
              @Published var messages: [ChatMessage] = [] { didSet { save() } }
              @Published var isSending = false

              private let storageKey = "chatMessagesV1"

              init() {
                  if let data = UserDefaults.standard.data(forKey: storageKey),
                     let decoded = try? JSONDecoder().decode([ChatMessage].self, from: data) {
                      messages = decoded
                  }
              }

              private func save() {
                  let limited = Array(messages.suffix(100))
                  if let data = try? JSONEncoder().encode(limited) {
                      UserDefaults.standard.set(data, forKey: storageKey)
                  }
              }

              func clear() { messages = [] }
          }

          @MainActor
          final class AttachmentStore: ObservableObject {
              @Published var current: InputAttachment?
              @Published var isLoading = false
          }

          @MainActor
          final class UsageLedger: ObservableObject {
              @Published private(set) var total = 0
              @Published private(set) var byProvider: [String: Int] = [:]

              private let defaults = UserDefaults.standard
              private let dayKey = "usageDay"
              private let countsKey = "usageCounts"

              init() { refresh() }

              private var today: String {
                  let formatter = DateFormatter()
                  formatter.calendar = .current
                  formatter.locale = Locale(identifier: "en_US_POSIX")
                  formatter.dateFormat = "yyyy-MM-dd"
                  return formatter.string(from: Date())
              }

              func refresh() {
                  if defaults.string(forKey: dayKey) != today {
                      defaults.set(today, forKey: dayKey)
                      defaults.removeObject(forKey: countsKey)
                  }
                  if let data = defaults.data(forKey: countsKey),
                     let decoded = try? JSONDecoder().decode([String: Int].self, from: data) {
                      byProvider = decoded
                  } else {
                      byProvider = [:]
                  }
                  total = byProvider.values.reduce(0, +)
              }

              func canSend(limit: Int) -> Bool {
                  refresh()
                  return limit < 1 || total < limit
              }

              func record(_ provider: ProviderID) {
                  record(label: provider.rawValue)
              }

              func record(label: String) {
                  refresh()
                  byProvider[label, default: 0] += 1
                  total = byProvider.values.reduce(0, +)
                  if let data = try? JSONEncoder().encode(byProvider) {
                      defaults.set(data, forKey: countsKey)
                  }
              }
          }

          // MARK: - AI API client

          final class AIService {
              static let shared = AIService()
              private init() {}

              @MainActor
              func chat(
                  history: [ChatMessage],
                  prompt: String,
                  attachment: InputAttachment?,
                  selected: ProviderID,
                  settings: AppSettings
              ) async throws -> ChatResult {
                  let effectivePrompt = makePrompt(prompt, attachment: attachment)
                  let hasImage = attachment?.imageData != nil

                  let candidates: [ProviderID]
                  if selected == .auto {
                      candidates = hasImage
                          ? [.gemini, .groq, .openRouter, .siliconFlow, .custom]
                          : [.groq, .gemini, .siliconFlow, .openRouter, .custom]
                  } else {
                      candidates = [selected]
                  }

                  var failures: [String] = []
                  var attempted = false
                  for provider in candidates {
                      let key = settings.key(for: provider)
                      if provider != .custom && key.isEmpty { continue }
                      if provider == .custom && settings.customBaseURL.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty { continue }
                      if settings.model(for: provider).trimmingCharacters(in: .whitespacesAndNewlines).isEmpty { continue }

                      attempted = true
                      do {
                          let text: String
                          if provider == .gemini {
                              text = try await geminiChat(
                                  history: history,
                                  prompt: effectivePrompt,
                                  attachment: attachment,
                                  key: key,
                                  model: settings.geminiModel,
                                  systemPrompt: settings.systemPrompt
                              )
                          } else {
                              text = try await openAIChat(
                                  history: history,
                                  prompt: effectivePrompt,
                                  attachment: attachment,
                                  provider: provider,
                                  key: key,
                                  model: settings.model(for: provider),
                                  baseURL: settings.baseURL(for: provider),
                                  systemPrompt: settings.systemPrompt
                              )
                          }
                          guard !text.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                              throw ServiceError("The provider returned an empty response")
                          }
                          return ChatResult(text: text, provider: provider)
                      } catch {
                          failures.append("\(provider.shortTitle): \(error.localizedDescription)")
                          if selected != .auto { throw error }
                      }
                  }

                  if !attempted {
                      throw ServiceError("Add at least one API key in Settings, and make sure its model name is filled in.")
                  }
                  throw ServiceError("All configured providers failed:\n" + failures.joined(separator: "\n"))
              }

              private func makePrompt(_ prompt: String, attachment: InputAttachment?) -> String {
                  guard let attachment else { return prompt }
                  let maxCharacters = 80_000
                  let text = String(attachment.extractedText.prefix(maxCharacters))
                  if text.isEmpty { return prompt }
                  return """
                  \(prompt)

                  --- ATTACHED FILE: \(attachment.name) ---
                  \(text)
                  --- END ATTACHED FILE ---
                  """
              }

              private func geminiChat(
                  history: [ChatMessage],
                  prompt: String,
                  attachment: InputAttachment?,
                  key: String,
                  model: String,
                  systemPrompt: String
              ) async throws -> String {
                  guard let encodedModel = model.addingPercentEncoding(withAllowedCharacters: .urlPathAllowed),
                        let url = URL(string: "https://generativelanguage.googleapis.com/v1beta/models/\(encodedModel):generateContent") else {
                      throw ServiceError("Invalid Gemini model name")
                  }

                  var contents: [[String: Any]] = history.suffix(20).map { message in
                      [
                          "role": message.role == .assistant ? "model" : "user",
                          "parts": [["text": message.text]]
                      ]
                  }

                  var finalParts: [[String: Any]] = [["text": prompt]]
                  if let data = attachment?.imageData {
                      finalParts.append([
                          "inlineData": [
                              "mimeType": attachment?.mimeType ?? "image/jpeg",
                              "data": data.base64EncodedString()
                          ]
                      ])
                  }
                  contents.append(["role": "user", "parts": finalParts])

                  let body: [String: Any] = [
                      "systemInstruction": ["parts": [["text": systemPrompt]]],
                      "contents": contents,
                      "generationConfig": ["temperature": 0.6, "maxOutputTokens": 4096]
                  ]

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.timeoutInterval = 180
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue(key, forHTTPHeaderField: "x-goog-api-key")
                  request.httpBody = try JSONSerialization.data(withJSONObject: body)

                  let json = try await performJSON(request)
                  guard let candidates = json["candidates"] as? [[String: Any]],
                        let content = candidates.first?["content"] as? [String: Any],
                        let parts = content["parts"] as? [[String: Any]] else {
                      throw ServiceError(apiMessage(json) ?? "Gemini response format was not recognized")
                  }
                  return parts.compactMap { $0["text"] as? String }.joined(separator: "\n")
              }

              private func openAIChat(
                  history: [ChatMessage],
                  prompt: String,
                  attachment: InputAttachment?,
                  provider: ProviderID,
                  key: String,
                  model: String,
                  baseURL: String,
                  systemPrompt: String
              ) async throws -> String {
                  let endpointString: String
                  let trimmed = baseURL.trimmingCharacters(in: CharacterSet(charactersIn: "/"))
                  if trimmed.hasSuffix("chat/completions") {
                      endpointString = trimmed
                  } else {
                      endpointString = trimmed + "/chat/completions"
                  }
                  guard let url = URL(string: endpointString) else { throw ServiceError("Invalid base URL") }

                  var messages: [[String: Any]] = [["role": "system", "content": systemPrompt]]
                  messages += history.suffix(20).map { message in
                      ["role": message.role.rawValue, "content": message.text]
                  }

                  if let data = attachment?.imageData, provider != .siliconFlow {
                      messages.append([
                          "role": "user",
                          "content": [
                              ["type": "text", "text": prompt],
                              [
                                  "type": "image_url",
                                  "image_url": ["url": "data:\(attachment?.mimeType ?? "image/jpeg");base64,\(data.base64EncodedString())"]
                              ]
                          ]
                      ])
                  } else {
                      messages.append(["role": "user", "content": prompt])
                  }

                  let body: [String: Any] = [
                      "model": model,
                      "messages": messages,
                      "temperature": 0.6,
                      "max_tokens": 4096
                  ]

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.timeoutInterval = 180
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  if !key.isEmpty { request.setValue("Bearer \(key)", forHTTPHeaderField: "Authorization") }
                  if provider == .openRouter {
                      request.setValue("AI Hub iOS", forHTTPHeaderField: "X-Title")
                  }
                  request.httpBody = try JSONSerialization.data(withJSONObject: body)

                  let json = try await performJSON(request)
                  guard let choices = json["choices"] as? [[String: Any]],
                        let message = choices.first?["message"] as? [String: Any] else {
                      throw ServiceError(apiMessage(json) ?? "OpenAI-compatible response format was not recognized")
                  }
                  if let content = message["content"] as? String { return content }
                  if let blocks = message["content"] as? [[String: Any]] {
                      return blocks.compactMap { ($0["text"] as? String) ?? ($0["content"] as? String) }.joined(separator: "\n")
                  }
                  throw ServiceError("The provider returned no text")
              }

              private func performJSON(_ request: URLRequest) async throws -> [String: Any] {
                  let (data, response) = try await URLSession.shared.data(for: request)
                  guard let http = response as? HTTPURLResponse else { throw ServiceError("No HTTP response") }
                  let json = ((try? JSONSerialization.jsonObject(with: data)) as? [String: Any]) ?? [:]
                  guard (200...299).contains(http.statusCode) else {
                      let fallback = String(data: data, encoding: .utf8) ?? HTTPURLResponse.localizedString(forStatusCode: http.statusCode)
                      throw ServiceError(apiMessage(json) ?? fallback, statusCode: http.statusCode)
                  }
                  return json
              }

              private func apiMessage(_ json: [String: Any]) -> String? {
                  if let error = json["error"] as? [String: Any] {
                      return (error["message"] as? String) ?? (error["detail"] as? String)
                  }
                  return json["message"] as? String
              }
          }

          // MARK: - Pollinations image client

          final class ImageAIService {
              static let shared = ImageAIService()
              private init() {}

              func generate(prompt: String, model: String, apiKey: String) async throws -> UIImage {
                  guard !apiKey.isEmpty else {
                      throw ServiceError("Add a Pollinations publishable app key in Settings before generating images.")
                  }
                  let promptPathCharacters = CharacterSet.urlPathAllowed.subtracting(CharacterSet(charactersIn: "/?#"))
                  guard let escaped = prompt.addingPercentEncoding(withAllowedCharacters: promptPathCharacters),
                        var components = URLComponents(string: "https://gen.pollinations.ai/image/\(escaped)") else {
                      throw ServiceError("Invalid image prompt")
                  }
                  components.queryItems = [
                      URLQueryItem(name: "model", value: model),
                      URLQueryItem(name: "width", value: "1024"),
                      URLQueryItem(name: "height", value: "1024"),
                      URLQueryItem(name: "safe", value: "true"),
                      URLQueryItem(name: "seed", value: "-1")
                  ]
                  guard let url = components.url else { throw ServiceError("Could not create image URL") }
                  var request = URLRequest(url: url)
                  request.timeoutInterval = 300
                  if !apiKey.isEmpty { request.setValue("Bearer \(apiKey)", forHTTPHeaderField: "Authorization") }
                  let (data, response) = try await URLSession.shared.data(for: request)
                  guard let http = response as? HTTPURLResponse else { throw ServiceError("No image response") }
                  guard (200...299).contains(http.statusCode), let image = UIImage(data: data) else {
                      let message = parseError(data) ?? "Image generation failed"
                      throw ServiceError(message, statusCode: http.statusCode)
                  }
                  return image
              }

              func edit(imageData: Data, prompt: String, model: String, apiKey: String) async throws -> UIImage {
                  guard !apiKey.isEmpty else {
                      throw ServiceError("Pollinations image editing requires a publishable app key. Add it in Settings.")
                  }
                  guard let url = URL(string: "https://gen.pollinations.ai/v1/images/edits") else {
                      throw ServiceError("Invalid edit endpoint")
                  }
                  let boundary = "Boundary-\(UUID().uuidString)"
                  var body = Data()

                  func addField(_ name: String, _ value: String) {
                      body.append("--\(boundary)\r\n".data(using: .utf8)!)
                      body.append("Content-Disposition: form-data; name=\"\(name)\"\r\n\r\n".data(using: .utf8)!)
                      body.append("\(value)\r\n".data(using: .utf8)!)
                  }

                  addField("prompt", prompt)
                  addField("model", model)
                  addField("size", "1024x1024")
                  addField("response_format", "b64_json")
                  body.append("--\(boundary)\r\n".data(using: .utf8)!)
                  body.append("Content-Disposition: form-data; name=\"image\"; filename=\"source.jpg\"\r\n".data(using: .utf8)!)
                  body.append("Content-Type: image/jpeg\r\n\r\n".data(using: .utf8)!)
                  body.append(imageData)
                  body.append("\r\n--\(boundary)--\r\n".data(using: .utf8)!)

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.timeoutInterval = 300
                  request.setValue("multipart/form-data; boundary=\(boundary)", forHTTPHeaderField: "Content-Type")
                  request.setValue("Bearer \(apiKey)", forHTTPHeaderField: "Authorization")
                  request.httpBody = body

                  let (data, response) = try await URLSession.shared.data(for: request)
                  guard let http = response as? HTTPURLResponse else { throw ServiceError("No edit response") }
                  guard (200...299).contains(http.statusCode) else {
                      throw ServiceError(parseError(data) ?? "Image editing failed", statusCode: http.statusCode)
                  }
                  if let image = UIImage(data: data) { return image }
                  guard let json = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any],
                        let items = json["data"] as? [[String: Any]],
                        let first = items.first else {
                      throw ServiceError("Image edit response was not recognized")
                  }
                  if let base64 = first["b64_json"] as? String,
                     let decoded = Data(base64Encoded: base64),
                     let image = UIImage(data: decoded) { return image }
                  if let string = first["url"] as? String, let remoteURL = URL(string: string) {
                      let (remoteData, _) = try await URLSession.shared.data(from: remoteURL)
                      if let image = UIImage(data: remoteData) { return image }
                  }
                  throw ServiceError("No image found in edit response")
              }

              private func parseError(_ data: Data) -> String? {
                  guard let json = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any] else {
                      return String(data: data, encoding: .utf8)
                  }
                  if let error = json["error"] as? [String: Any] { return error["message"] as? String }
                  if let error = json["error"] as? String { return error }
                  return json["message"] as? String
              }
          }

          // MARK: - Document extraction

          enum SupportedDocumentTypes {
              static let all: [UTType] = {
                  var values: [UTType] = [.pdf, .plainText, .commaSeparatedText, .image, .data]
                  for ext in ["xlsx", "xlsm", "docx", "pptx", "csv", "tsv", "json", "md"] {
                      if let type = UTType(filenameExtension: ext) { values.append(type) }
                  }
                  return values
              }()
          }

          enum DocumentExtractor {
              static func extract(from url: URL) async throws -> ExtractionResult {
                  let access = url.startAccessingSecurityScopedResource()
                  defer { if access { url.stopAccessingSecurityScopedResource() } }

                  let ext = url.pathExtension.lowercased()
                  let name = url.lastPathComponent

                  switch ext {
                  case "pdf":
                      let text = try await extractPDF(url)
                      return ExtractionResult(name: name, mimeType: "application/pdf", text: text, imageData: nil)
                  case "xlsx", "xlsm":
                      return ExtractionResult(name: name, mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", text: try extractXLSX(url), imageData: nil)
                  case "docx":
                      return ExtractionResult(name: name, mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", text: try extractDOCX(url), imageData: nil)
                  case "pptx":
                      return ExtractionResult(name: name, mimeType: "application/vnd.openxmlformats-officedocument.presentationml.presentation", text: try extractPPTX(url), imageData: nil)
                  case "jpg", "jpeg", "png", "heic", "heif", "webp":
                      let data = try Data(contentsOf: url)
                      guard let image = UIImage(data: data) else { throw ServiceError("Unsupported image") }
                      let text = (try? await recognizeText(image)) ?? ""
                      return ExtractionResult(name: name, mimeType: "image/jpeg", text: text, imageData: normalizedImageData(image, original: data))
                  default:
                      let data = try Data(contentsOf: url)
                      guard let text = decodeText(data) else {
                          throw ServiceError("This file type cannot be extracted locally. Convert old .xls/.doc files to .xlsx/.docx first.")
                      }
                      return ExtractionResult(name: name, mimeType: mimeType(for: ext), text: text, imageData: nil)
                  }
              }

              static func extractImageData(_ data: Data, name: String = "Photo.jpg") async -> InputAttachment? {
                  guard let image = UIImage(data: data) else { return nil }
                  let text = (try? await recognizeText(image)) ?? ""
                  return InputAttachment(name: name, mimeType: "image/jpeg", extractedText: text, imageData: normalizedImageData(image, original: data))
              }

              private static func extractPDF(_ url: URL) async throws -> String {
                  guard let document = PDFDocument(url: url) else { throw ServiceError("Could not open PDF") }
                  var pages: [String] = []
                  for index in 0..<document.pageCount {
                      if let text = document.page(at: index)?.string, !text.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                          pages.append("[Page \(index + 1)]\n\(text)")
                      }
                  }
                  if !pages.isEmpty { return pages.joined(separator: "\n\n") }

                  // Scanned PDF fallback: OCR the first 25 pages to keep memory and API prompts reasonable.
                  for index in 0..<min(document.pageCount, 25) {
                      guard let page = document.page(at: index) else { continue }
                      let image = page.thumbnail(of: CGSize(width: 1800, height: 2400), for: .mediaBox)
                      let text = (try? await recognizeText(image)) ?? ""
                      pages.append("[OCR Page \(index + 1)]\n\(text)")
                  }
                  return pages.joined(separator: "\n\n")
              }

              private static func extractXLSX(_ url: URL) throws -> String {
                  guard let archive = Archive(url: url, accessMode: .read) else { throw ServiceError("Could not open Excel archive") }
                  var sharedStrings: [String] = []
                  if let entry = archive["xl/sharedStrings.xml"] {
                      let data = try data(from: entry, in: archive)
                      let delegate = SharedStringsXMLDelegate()
                      let parser = XMLParser(data: data)
                      parser.delegate = delegate
                      parser.parse()
                      sharedStrings = delegate.strings
                  }

                  let sheets = archive
                      .filter { $0.path.hasPrefix("xl/worksheets/sheet") && $0.path.hasSuffix(".xml") }
                      .sorted { naturalOrder($0.path, $1.path) }
                  guard !sheets.isEmpty else { throw ServiceError("No worksheets found") }

                  var output: [String] = []
                  for (index, entry) in sheets.enumerated() {
                      let delegate = WorksheetXMLDelegate(sharedStrings: sharedStrings)
                      let parser = XMLParser(data: try data(from: entry, in: archive))
                      parser.delegate = delegate
                      parser.parse()
                      output.append("=== Sheet \(index + 1) ===\n" + delegate.lines.joined(separator: "\n"))
                  }
                  return output.joined(separator: "\n\n")
              }

              private static func extractDOCX(_ url: URL) throws -> String {
                  guard let archive = Archive(url: url, accessMode: .read), let entry = archive["word/document.xml"] else {
                      throw ServiceError("Could not open Word document")
                  }
                  return parseOfficeText(try data(from: entry, in: archive), paragraphElements: ["p"])
              }

              private static func extractPPTX(_ url: URL) throws -> String {
                  guard let archive = Archive(url: url, accessMode: .read) else { throw ServiceError("Could not open PowerPoint") }
                  let slides = archive
                      .filter { $0.path.hasPrefix("ppt/slides/slide") && $0.path.hasSuffix(".xml") }
                      .sorted { naturalOrder($0.path, $1.path) }
                  var output: [String] = []
                  for (index, entry) in slides.enumerated() {
                      let text = parseOfficeText(try data(from: entry, in: archive), paragraphElements: ["p"])
                      output.append("=== Slide \(index + 1) ===\n\(text)")
                  }
                  return output.joined(separator: "\n\n")
              }

              private static func parseOfficeText(_ data: Data, paragraphElements: Set<String>) -> String {
                  let delegate = OfficeTextXMLDelegate(paragraphElements: paragraphElements)
                  let parser = XMLParser(data: data)
                  parser.delegate = delegate
                  parser.parse()
                  return delegate.text.trimmingCharacters(in: .whitespacesAndNewlines)
              }

              private static func data(from entry: Entry, in archive: Archive) throws -> Data {
                  var result = Data()
                  _ = try archive.extract(entry) { chunk in result.append(chunk) }
                  return result
              }

              private static func recognizeText(_ image: UIImage) async throws -> String {
                  guard let cgImage = image.cgImage else { throw ServiceError("Could not decode image") }
                  return try await withCheckedThrowingContinuation { continuation in
                      let request = VNRecognizeTextRequest { request, error in
                          if let error {
                              continuation.resume(throwing: error)
                              return
                          }
                          let observations = request.results as? [VNRecognizedTextObservation] ?? []
                          let lines = observations.compactMap { $0.topCandidates(1).first?.string }
                          continuation.resume(returning: lines.joined(separator: "\n"))
                      }
                      request.recognitionLevel = .accurate
                      request.usesLanguageCorrection = true
                      request.recognitionLanguages = ["ar-SA", "en-US"]
                      DispatchQueue.global(qos: .userInitiated).async {
                          do {
                              try VNImageRequestHandler(cgImage: cgImage, options: [:]).perform([request])
                          } catch {
                              continuation.resume(throwing: error)
                          }
                      }
                  }
              }

              private static func normalizedImageData(_ image: UIImage, original: Data) -> Data {
                  let maxDimension: CGFloat = 2048
                  let size = image.size
                  let scale = min(1, maxDimension / max(size.width, size.height))
                  guard scale < 1 else { return image.jpegData(compressionQuality: 0.86) ?? original }
                  let target = CGSize(width: size.width * scale, height: size.height * scale)
                  let renderer = UIGraphicsImageRenderer(size: target)
                  let resized = renderer.image { _ in image.draw(in: CGRect(origin: .zero, size: target)) }
                  return resized.jpegData(compressionQuality: 0.84) ?? original
              }

              private static func decodeText(_ data: Data) -> String? {
                  if let value = String(data: data, encoding: .utf8) { return value }
                  if let value = String(data: data, encoding: .utf16) { return value }
                  if let value = String(data: data, encoding: .isoLatin1) { return value }
                  return nil
              }

              private static func mimeType(for ext: String) -> String {
                  switch ext {
                  case "jpg", "jpeg": return "image/jpeg"
                  case "png": return "image/png"
                  case "heic", "heif": return "image/heic"
                  case "webp": return "image/webp"
                  case "csv": return "text/csv"
                  case "json": return "application/json"
                  default: return "text/plain"
                  }
              }

              private static func naturalOrder(_ lhs: String, _ rhs: String) -> Bool {
                  lhs.localizedStandardCompare(rhs) == .orderedAscending
              }
          }

          private final class SharedStringsXMLDelegate: NSObject, XMLParserDelegate {
              var strings: [String] = []
              private var current = ""
              private var inString = false
              private var inText = false

              func parser(_ parser: XMLParser, didStartElement elementName: String, namespaceURI: String?, qualifiedName qName: String?, attributes attributeDict: [String: String] = [:]) {
                  let name = elementName.split(separator: ":").last.map(String.init) ?? elementName
                  if name == "si" { current = ""; inString = true }
                  if name == "t" && inString { inText = true }
              }

              func parser(_ parser: XMLParser, foundCharacters string: String) {
                  if inText { current += string }
              }

              func parser(_ parser: XMLParser, didEndElement elementName: String, namespaceURI: String?, qualifiedName qName: String?) {
                  let name = elementName.split(separator: ":").last.map(String.init) ?? elementName
                  if name == "t" { inText = false }
                  if name == "si" { strings.append(current); inString = false }
              }
          }

          private final class WorksheetXMLDelegate: NSObject, XMLParserDelegate {
              let sharedStrings: [String]
              var lines: [String] = []
              private var cells: [String] = []
              private var cellType = ""
              private var cellRef = ""
              private var value = ""
              private var inline = ""
              private var inValue = false
              private var inInlineText = false

              init(sharedStrings: [String]) { self.sharedStrings = sharedStrings }

              func parser(_ parser: XMLParser, didStartElement elementName: String, namespaceURI: String?, qualifiedName qName: String?, attributes attributeDict: [String: String] = [:]) {
                  let name = elementName.split(separator: ":").last.map(String.init) ?? elementName
                  switch name {
                  case "row": cells = []
                  case "c":
                      cellType = attributeDict["t"] ?? ""
                      cellRef = attributeDict["r"] ?? ""
                      value = ""
                      inline = ""
                  case "v": inValue = true
                  case "t": if cellType == "inlineStr" { inInlineText = true }
                  default: break
                  }
              }

              func parser(_ parser: XMLParser, foundCharacters string: String) {
                  if inValue { value += string }
                  if inInlineText { inline += string }
              }

              func parser(_ parser: XMLParser, didEndElement elementName: String, namespaceURI: String?, qualifiedName qName: String?) {
                  let name = elementName.split(separator: ":").last.map(String.init) ?? elementName
                  switch name {
                  case "v": inValue = false
                  case "t": inInlineText = false
                  case "c":
                      var displayed = inline.isEmpty ? value : inline
                      if cellType == "s", let index = Int(value), sharedStrings.indices.contains(index) {
                          displayed = sharedStrings[index]
                      } else if cellType == "b" {
                          displayed = value == "1" ? "TRUE" : "FALSE"
                      }
                      if !displayed.isEmpty { cells.append(cellRef.isEmpty ? displayed : "\(cellRef)=\(displayed)") }
                  case "row": if !cells.isEmpty { lines.append(cells.joined(separator: " | ")) }
                  default: break
                  }
              }
          }

          private final class OfficeTextXMLDelegate: NSObject, XMLParserDelegate {
              let paragraphElements: Set<String>
              var text = ""
              private var inText = false

              init(paragraphElements: Set<String>) { self.paragraphElements = paragraphElements }

              func parser(_ parser: XMLParser, didStartElement elementName: String, namespaceURI: String?, qualifiedName qName: String?, attributes attributeDict: [String: String] = [:]) {
                  let name = elementName.split(separator: ":").last.map(String.init) ?? elementName
                  if name == "t" { inText = true }
              }

              func parser(_ parser: XMLParser, foundCharacters string: String) {
                  if inText { text += string }
              }

              func parser(_ parser: XMLParser, didEndElement elementName: String, namespaceURI: String?, qualifiedName qName: String?) {
                  let name = elementName.split(separator: ":").last.map(String.init) ?? elementName
                  if name == "t" { inText = false; text += " " }
                  if paragraphElements.contains(name) { text += "\n" }
              }
          }

