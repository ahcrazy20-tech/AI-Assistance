          struct FilesView: View {
              @EnvironmentObject private var attachment: AttachmentStore
              @State private var showImporter = false
              @State private var previewText = ""
              @State private var fileName = ""
              @State private var errorMessage = ""
              @State private var showError = false

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 16) {
                          if attachment.isLoading {
                              Spacer()
                              ProgressView("Extracting file…")
                              Spacer()
                          } else if previewText.isEmpty {
                              Spacer()
                              Image(systemName: "doc.text.magnifyingglass")
                                  .font(.system(size: 52)).foregroundStyle(.indigo)
                              Text("Local Document Extraction").font(.title2.bold())
                              Text("PDF (including OCR), XLSX/XLSM, DOCX, PPTX, CSV, JSON, Markdown, text, and images. Extraction happens on your iPhone before analysis.")
                                  .multilineTextAlignment(.center).foregroundStyle(.secondary).padding(.horizontal)
                              Button { showImporter = true } label: { Label("Choose File", systemImage: "folder") }
                                  .buttonStyle(.borderedProminent)
                              Spacer()
                          } else {
                              HStack {
                                  VStack(alignment: .leading) {
                                      Text(fileName).font(.headline).lineLimit(1)
                                      Text("\(previewText.count.formatted()) characters").font(.caption).foregroundStyle(.secondary)
                                  }
                                  Spacer()
                                  Button("Another") { showImporter = true }
                              }
                              .padding(.horizontal)
                              ScrollView {
                                  Text(previewText)
                                      .font(.system(.footnote, design: .monospaced))
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .textSelection(.enabled)
                                      .padding()
                              }
                              .background(Color(.secondarySystemBackground))
                              .clipShape(RoundedRectangle(cornerRadius: 14))
                              .padding(.horizontal)
                              Label("Ready in Chat as the current attachment", systemImage: "checkmark.circle.fill")
                                  .font(.footnote).foregroundStyle(.green)
                                  .padding(.bottom)
                          }
                      }
                      .navigationTitle("Files / الملفات")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button { showImporter = true } label: { Image(systemName: "plus") }
                          }
                      }
                  }
                  .fileImporter(isPresented: $showImporter, allowedContentTypes: SupportedDocumentTypes.all, allowsMultipleSelection: false) { result in
                      switch result {
                      case .success(let urls): if let url = urls.first { extract(url) }
                      case .failure(let error): present(error.localizedDescription)
                      }
                  }
                  .alert("Error", isPresented: $showError) { Button("OK", role: .cancel) {} } message: { Text(errorMessage) }
              }

              private func extract(_ url: URL) {
                  attachment.isLoading = true
                  Task {
                      defer { attachment.isLoading = false }
                      do {
                          let result = try await DocumentExtractor.extract(from: url)
                          let item = InputAttachment(name: result.name, mimeType: result.mimeType, extractedText: result.text, imageData: result.imageData)
                          attachment.current = item
                          fileName = result.name
                          previewText = result.text.isEmpty && result.imageData != nil ? "Image loaded. No OCR text was detected, but a vision-capable AI can still analyze it." : result.text
                      } catch { present(error.localizedDescription) }
                  }
              }

              private func present(_ message: String) { errorMessage = message; showError = true }
          }

