              private func extract(_ url: URL) {
                  attachment.isLoading = true
                  Task {
                      defer { attachment.isLoading = false }
                      do {
                          let result = try await DocumentExtractor.extract(from: url)
                          attachment.current = InputAttachment(name: result.name, mimeType: result.mimeType, extractedText: result.text, imageData: result.imageData)
                          fileName = result.name
                          previewText = result.text.isEmpty && result.imageData != nil ? "Image loaded. No OCR text was detected, but a vision model can analyze it." : result.text
                      } catch { present(error.localizedDescription) }
