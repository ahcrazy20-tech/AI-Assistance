                          Section("Custom OpenAI-compatible API") {
                              TextField("HTTPS base URL", text: $settings.customBaseURL).textInputAutocapitalization(.never).autocorrectionDisabled().keyboardType(.URL).focused($settingsInputFocused)
                              TextField("Model", text: $settings.customModel).textInputAutocapitalization(.never).autocorrectionDisabled().focused($settingsInputFocused)
                              SecureField("API key (optional)", text: $customKey).textInputAutocapitalization(.never).autocorrectionDisabled().focused($settingsInputFocused)
                              Stepper(value: $settings.customDailyLimit, in: 1...20000, step: 25) { Text("Local daily limit: \(settings.customDailyLimit)") }
                              HStack { KeyStatusBadge(state: state(.custom)); Spacer(); Button("Test endpoint") { test(.custom, key: customKey) }.disabled(state(.custom) == .checking) }
                          }
          
                          Section("Assistant") {
                              Picker("Response style", selection: $settings.responseStyle) {
                                  ForEach(ResponseStyle.allCases) { style in Text(style.title).tag(style) }
                              }
                              TextField("System prompt", text: $settings.systemPrompt, axis: .vertical).lineLimit(3...9).focused($settingsInputFocused)
                              Text("A fixed quality contract is appended automatically: answer in the user's language, lead with the result, use useful Markdown structure, and never invent citations.")
                                  .font(.caption).foregroundStyle(.secondary)
                          }
          
                          Section {
                              Button { saveAndTestAll() } label: {
                                  HStack { Spacer(); if isTestingAll { ProgressView().padding(.trailing, 4) }; Label(saved ? "Tests completed" : "Save & Test All", systemImage: saved ? "checkmark.seal.fill" : "key.viewfinder"); Spacer() }
                              }.disabled(isTestingAll)
                          } footer: {
                              Text("Provider tests use account/model endpoints and do not send a chat prompt. Keys are stored in iOS Keychain.")
                          }
                      }
                      .scrollDismissesKeyboard(.interactively).navigationTitle("Settings / الإعدادات")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) { TopTabMenu() }
                          ToolbarItemGroup(placement: .keyboard) { Spacer(); Button("Done") { settingsInputFocused = false }.fontWeight(.semibold) }
                      }
                  }
                  .onAppear(perform: loadKeys)
                  .onChange(of: geminiKey) { _ in checks[.gemini] = .unknown }
                  .onChange(of: groqKey) { _ in checks[.groq] = .unknown }
                  .onChange(of: openRouterKey) { _ in checks[.openRouter] = .unknown }
                  .onChange(of: siliconKey) { _ in checks[.siliconFlow] = .unknown }
                  .onChange(of: customKey) { _ in checks[.custom] = .unknown }
                  .onChange(of: pollinationsKey) { _ in pollinationsCheck = .unknown }
                  .alert("Settings Error", isPresented: $showError) { Button("OK", role: .cancel) {} } message: { Text(errorMessage) }
              }
          
              @ViewBuilder
              private func providerSection(provider: ProviderID, title: String, key: Binding<String>, model: Binding<String>, limit: Binding<Int>) -> some View {
                  Section {
                      SecureField("API key", text: key).textInputAutocapitalization(.never).autocorrectionDisabled().focused($settingsInputFocused)
                      TextField("Model ID", text: model).textInputAutocapitalization(.never).autocorrectionDisabled().focused($settingsInputFocused)
                      Stepper(value: limit, in: 1...20000, step: 25) { Text("Local daily limit: \(limit.wrappedValue)") }
                      LabeledContent("Used today", value: "\(usage.byProvider[provider.rawValue] ?? 0)")
                      HStack { KeyStatusBadge(state: state(provider)); Spacer(); Button("Test key") { test(provider, key: key.wrappedValue) }.disabled(state(provider) == .checking) }
                  } header: { Text(title) }
              }
          
              private func state(_ provider: ProviderID) -> KeyCheckState { checks[provider] ?? .unknown }
              private func loadKeys() {
                  geminiKey = settings.key(for: .gemini); groqKey = settings.key(for: .groq); openRouterKey = settings.key(for: .openRouter)
                  siliconKey = settings.key(for: .siliconFlow); customKey = settings.key(for: .custom); pollinationsKey = settings.pollinationsKey
              }
              private func saveKeys() throws {
                  try settings.setKey(geminiKey, for: .gemini); try settings.setKey(groqKey, for: .groq); try settings.setKey(openRouterKey, for: .openRouter)
                  try settings.setKey(siliconKey, for: .siliconFlow); try settings.setKey(customKey, for: .custom); try settings.setPollinationsKey(pollinationsKey)
              }
              private func test(_ provider: ProviderID, key: String) {
                  do { try settings.setKey(key, for: provider) }
                  catch { present(error.localizedDescription); return }
                  checks[provider] = .checking
                  Task { checks[provider] = await KeyValidationService.shared.validate(provider: provider, key: key, settings: settings) }
              }
              private func checkPollinations() {
                  do { try settings.setPollinationsKey(pollinationsKey); pollinationsCheck = KeyValidationService.shared.validatePollinationsFormat(key: pollinationsKey) }
                  catch { present(error.localizedDescription) }
              }
              private func saveAndTestAll() {
                  settingsInputFocused = false
                  do { try saveKeys() } catch { present(error.localizedDescription); return }
                  isTestingAll = true; saved = false
                  for provider in [ProviderID.gemini, .groq, .openRouter, .siliconFlow, .custom] { checks[provider] = .checking }
                  pollinationsCheck = KeyValidationService.shared.validatePollinationsFormat(key: pollinationsKey)
                  Task {
                      async let a = KeyValidationService.shared.validate(provider: .gemini, key: geminiKey, settings: settings)
                      async let b = KeyValidationService.shared.validate(provider: .groq, key: groqKey, settings: settings)
                      async let c = KeyValidationService.shared.validate(provider: .openRouter, key: openRouterKey, settings: settings)
                      async let d = KeyValidationService.shared.validate(provider: .siliconFlow, key: siliconKey, settings: settings)
                      async let e = KeyValidationService.shared.validate(provider: .custom, key: customKey, settings: settings)
                      let r = await (a, b, c, d, e)
                      checks[.gemini] = r.0; checks[.groq] = r.1; checks[.openRouter] = r.2; checks[.siliconFlow] = r.3; checks[.custom] = r.4
                      isTestingAll = false; saved = true
                      DispatchQueue.main.asyncAfter(deadline: .now() + 2) { saved = false }
                  }
              }
              private func present(_ text: String) { errorMessage = text; showError = true }
          }
          
          struct KeyStatusBadge: View {
              let state: KeyCheckState
              var body: some View {
                  HStack(spacing: 5) {
                      Label(state.title, systemImage: state.icon).font(.caption).foregroundStyle(state.color).lineLimit(2)
                      if state == .checking { ProgressView().controlSize(.small) }
                  }
              }
          }
          SWIFT_SOURCE

          mkdir -p GeneratedApp/Sources/Assets.xcassets/AppIcon.appiconset
          cat > GeneratedApp/Sources/Assets.xcassets/Contents.json <<'ASSET_ROOT'
          {"info":{"author":"xcode","version":1}}
          ASSET_ROOT
          cat > GeneratedApp/Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'APPICON_JSON'
          {
            "images": [
              {"filename":"icon-40.png",   "idiom":"iphone", "scale":"2x", "size":"20x20"},
              {"filename":"icon-60.png",   "idiom":"iphone", "scale":"3x", "size":"20x20"},
              {"filename":"icon-58.png",   "idiom":"iphone", "scale":"2x", "size":"29x29"},
              {"filename":"icon-87.png",   "idiom":"iphone", "scale":"3x", "size":"29x29"},
              {"filename":"icon-80.png",   "idiom":"iphone", "scale":"2x", "size":"40x40"},
              {"filename":"icon-120.png",  "idiom":"iphone", "scale":"3x", "size":"40x40"},
              {"filename":"icon-120.png",  "idiom":"iphone", "scale":"2x", "size":"60x60"},
              {"filename":"icon-180.png",  "idiom":"iphone", "scale":"3x", "size":"60x60"},
              {"filename":"icon-1024.png", "idiom":"ios-marketing", "scale":"1x", "size":"1024x1024"}
            ],
            "info": {"author":"xcode","version":1}
          }
          APPICON_JSON

          python3 - <<'ICON_PY'
          import struct, zlib
          from pathlib import Path
          out = Path("GeneratedApp/Sources/Assets.xcassets/AppIcon.appiconset")
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          def make_icon(size):
              rows = bytearray()
              for y in range(size):
                  rows.append(0)
                  for x in range(size):
                      u, v = x / max(1, size - 1), y / max(1, size - 1)
                      glow = max(0.0, 1.0 - ((u - .72) ** 2 + (v - .18) ** 2) ** .5 * 1.55)
                      r, g, b = int(43 + 35*u + 25*glow), int(38 + 72*v + 90*glow), int(145 + 74*u + 28*glow)
                      dx, dy = abs(x - size*.5), abs(y - size*.48)
                      star = (dx/(size*.055) + dy/(size*.29) < 1) or (dx/(size*.29) + dy/(size*.055) < 1)
                      dot1 = (x-size*.76)**2 + (y-size*.70)**2 < (size*.035)**2
                      dot2 = (x-size*.25)**2 + (y-size*.25)**2 < (size*.022)**2
                      if star or dot1 or dot2: r, g, b = 255, 255, 255
                      rows.extend((r, g, b, 255))
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(rows), 9)) + chunk(b"IEND", b"")
          for size in (40, 58, 60, 80, 87, 120, 180, 1024):
              (out / f"icon-{size}.png").write_bytes(make_icon(size))
          ICON_PY

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode project and resolve packages
        shell: bash
        working-directory: GeneratedApp
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project AIHub.xcodeproj -scheme AIHub

      - name: Build unsigned device IPA
        shell: bash
        working-directory: GeneratedApp
        run: |
          set -euo pipefail
          xcodebuild \
            -project AIHub.xcodeproj \
            -scheme AIHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-Unsigned \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          APP_PATH="DerivedData-Unsigned/Build/Products/Release-iphoneos/AIHub.app"
          test -d "$APP_PATH"
          rm -rf artifacts/Payload
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/AIHub.app
          (cd artifacts && zip -qry AIHub-unsigned.ipa Payload)
          rm -rf artifacts/Payload

      - name: Install optional signing certificate and profile
        if: env.HAS_SIGNING == 'true'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASS="${KEYCHAIN_PASSWORD:-aihub-temporary-keychain}"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/build_profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/aihub-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          chmod 600 "$CERT_PATH" "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          case "$PROFILE_APP_ID" in
            "$PROFILE_TEAM_ID.$BUNDLE_ID"|"$PROFILE_TEAM_ID.*") ;;
            *) echo "Provisioning profile does not match BUNDLE_ID=$BUNDLE_ID" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build optional signed development IPA
        if: env.HAS_SIGNING == 'true'
        shell: bash
        working-directory: GeneratedApp
        run: |
          set -euo pipefail
          rm -rf AIHub.xcarchive ExportedIPA
          xcodebuild archive \
            -project AIHub.xcodeproj \
            -scheme AIHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath AIHub.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$PROFILE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

          cat > ExportOptions.plist <<EXPORT_PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$PROFILE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EXPORT_PLIST
          xcodebuild -exportArchive -archivePath AIHub.xcarchive -exportPath ExportedIPA -exportOptionsPlist ExportOptions.plist
          cp ExportedIPA/*.ipa artifacts/AIHub-signed.ipa

      - name: Remove temporary signing material
        if: always() && env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_profile.mobileprovision" "$RUNNER_TEMP/build_profile.plist"

      - name: Write build information
        if: always()
        shell: bash
        working-directory: GeneratedApp
        run: |
          mkdir -p artifacts
          cat > artifacts/INSTALL.txt <<'TXT'
          AI Hub iOS 16.4+

          AIHub-unsigned.ipa must be signed before installation.
          AIHub-signed.ipa, when present, uses the development profile supplied in repository secrets.
          Open Settings in the app and add your own provider keys.

          Attachment controls:
          - Photo icon opens Photos directly.
          - Document icon opens Files/iCloud directly.
          - Scanner icon captures corrected multi-page documents and assembles a native PDF.
          - Supported: PDF, XLSX/XLSM, DOCX, PPTX, text/CSV/JSON/Markdown, and common images.
          - iOS 26 uses structured Vision document recognition; iOS 16.4–25 uses enhanced Vision OCR fallback.
          - Maximum imported file size: 50 MB.
          TXT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-iOS-${{ github.run_number }}
          path: GeneratedApp/artifacts/
          if-no-files-found: error
          retention-days: 14
