          import base64
          import gzip
          from pathlib import Path
          encoded = Path("GeneratedApp/AIHubApp.swift.gz.b64").read_text()
          source = gzip.decompress(base64.b64decode(encoded))
          Path("GeneratedApp/Sources/AIHubApp.swift").write_bytes(source)
