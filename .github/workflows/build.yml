          struct ImagesView: View {
              @EnvironmentObject private var settings: AppSettings
              @EnvironmentObject private var usage: UsageLedger
              @State private var prompt = ""
              @State private var sourceItem: PhotosPickerItem?
              @State private var sourceImage: UIImage?
              @State private var sourceData: Data?
              @State private var outputImage: UIImage?
              @State private var isWorking = false
              @State private var errorMessage = ""
              @State private var showError = false
              @State private var shareImage: ShareImage?
              @State private var saveMessage = ""
              @State private var showSaved = false
              @FocusState private var imagePromptFocused: Bool

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(spacing: 16) {
                              GroupBox {
                                  VStack(alignment: .leading, spacing: 10) {
                                      Text(sourceImage == nil ? "Generate a new image" : "Describe how to edit the selected image").font(.headline)
                                      TextField("Example: Replace the sky with a dramatic sunset", text: $prompt, axis: .vertical)
                                          .lineLimit(2...6).textFieldStyle(.roundedBorder).focused($imagePromptFocused)
                                      HStack {
                                          PhotosPicker(selection: $sourceItem, matching: .images, photoLibrary: .shared()) {
                                              Label(sourceImage == nil ? "Choose source" : "Change source", systemImage: "photo")
                                          }.buttonStyle(.bordered)
                                          if sourceImage != nil { Button("Remove", role: .destructive) { sourceImage = nil; sourceData = nil } }
                                          Spacer()
                                      }
                                  }
                              }
                              if let sourceImage {
                                  VStack(alignment: .leading) { Text("Source").font(.caption.bold()).foregroundStyle(.secondary); Image(uiImage: sourceImage).resizable().scaledToFit().frame(maxHeight: 230).clipShape(RoundedRectangle(cornerRadius: 12)) }
                              }
                              Button(action: runImageAI) {
                                  HStack { if isWorking { ProgressView().tint(.white) }; Label(sourceImage == nil ? "Generate" : "AI Edit", systemImage: "wand.and.stars") }.frame(maxWidth: .infinity)
                              }.buttonStyle(.borderedProminent).disabled(prompt.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty || isWorking)
                              if let outputImage {
                                  VStack(spacing: 10) {
                                      Image(uiImage: outputImage).resizable().scaledToFit().clipShape(RoundedRectangle(cornerRadius: 16))
                                      HStack {
                                          Button { saveToPhotos(outputImage) } label: { Label("Save", systemImage: "square.and.arrow.down") }
                                          Spacer(); Button { shareImage = ShareImage(image: outputImage) } label: { Label("Share", systemImage: "square.and.arrow.up") }
                                      }.buttonStyle(.bordered)
                                  }
                              }
                              Text("Generation: \(settings.imageModel) • Editing: \(settings.imageEditModel)").font(.caption).foregroundStyle(.secondary)
                          }.padding()
                      }
                      .scrollDismissesKeyboard(.interactively).navigationTitle("Images / الصور")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) { TopTabMenu() }
                          ToolbarItemGroup(placement: .keyboard) { Spacer(); Button("Done") { imagePromptFocused = false }.fontWeight(.semibold) }
                      }
                  }
                  .onChange(of: sourceItem) { item in loadSource(item) }
                  .sheet(item: $shareImage) { item in ShareSheet(items: [item.image]) }
                  .alert("Image Error", isPresented: $showError) { Button("OK", role: .cancel) {} } message: { Text(errorMessage) }
                  .alert("Saved", isPresented: $showSaved) { Button("OK", role: .cancel) {} } message: { Text(saveMessage) }
              }

              private func loadSource(_ item: PhotosPickerItem?) {
                  guard let item else { return }
                  Task {
                      defer { sourceItem = nil }
                      do {
                          let data: Data
                          let picked = try await item.loadTransferable(type: PickedImageData.self)
                          if let picked {
                              data = picked.data
                          } else {
                              let fallback = try await item.loadTransferable(type: Data.self)
                              guard let fallback else { throw ServiceError("The photo provider returned no data.") }
                              data = fallback
                          }
                          guard data.count <= DocumentExtractor.maxInputBytes, let image = UIImage(data: data) else { throw ServiceError("Could not load source image or it is too large.") }
                          sourceImage = image
                          sourceData = image.jpegData(compressionQuality: 0.88) ?? data
                      } catch { present(error.localizedDescription) }
                  }
              }

              private func runImageAI() {
                  let clean = prompt.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !clean.isEmpty else { return }
                  guard usage.canSend(label: "pollinations", limit: settings.pollinationsDailyLimit) else { present("The local Pollinations limit is reached."); return }
                  isWorking = true
                  Task {
                      defer { isWorking = false }
                      do {
                          outputImage = sourceData == nil
                              ? try await ImageAIService.shared.generate(prompt: clean, model: settings.imageModel, apiKey: settings.pollinationsKey)
                              : try await ImageAIService.shared.edit(imageData: sourceData!, prompt: clean, model: settings.imageEditModel, apiKey: settings.pollinationsKey)
                          usage.record(label: "pollinations")
                      } catch { present(error.localizedDescription) }
                  }
              }

              private func saveToPhotos(_ image: UIImage) {
                  Task {
                      do {
                          let status = await PHPhotoLibrary.requestAuthorization(for: .addOnly)
                          guard status == .authorized || status == .limited else { throw ServiceError("Photo Library permission was denied.") }
                          try await PHPhotoLibrary.shared().performChanges { PHAssetChangeRequest.creationRequestForAsset(from: image) }
                          saveMessage = "The image was saved to Photos."; showSaved = true
                      } catch { present(error.localizedDescription) }
                  }
              }
              private func present(_ text: String) { errorMessage = text; showError = true }
          }

          struct ShareImage: Identifiable { let id = UUID(); let image: UIImage }
          struct ShareSheet: UIViewControllerRepresentable {
              let items: [Any]
              func makeUIViewController(context: Context) -> UIActivityViewController { UIActivityViewController(activityItems: items, applicationActivities: nil) }
              func updateUIViewController(_ uiViewController: UIActivityViewController, context: Context) {}
          }

          struct SettingsView: View {
