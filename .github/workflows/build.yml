          struct ChatView: View {
              @EnvironmentObject private var settings: AppSettings
              @EnvironmentObject private var chat: ChatStore
              @EnvironmentObject private var attachment: AttachmentStore
              @EnvironmentObject private var usage: UsageLedger

              @State private var input = ""
              @State private var photoItem: PhotosPickerItem?
              @State private var showFileImporter = false
              @State private var errorMessage = ""
              @State private var showError = false

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          if chat.messages.isEmpty {
                              Spacer()
                              VStack(spacing: 14) {
                                  Image(systemName: "sparkles")
                                      .font(.system(size: 46, weight: .semibold))
                                      .foregroundStyle(.indigo)
                                  Text("AI Hub")
                                      .font(.largeTitle.bold())
                                  Text("Ask anything, attach an image, PDF, Excel, Word, PowerPoint, CSV, or text file.")
                                      .multilineTextAlignment(.center)
                                      .foregroundStyle(.secondary)
                                      .padding(.horizontal, 28)
                              }
                              Spacer()
                          } else {
                              ScrollViewReader { proxy in
                                  ScrollView {
                                      LazyVStack(spacing: 12) {
                                          ForEach(chat.messages) { message in
                                              MessageBubble(message: message).id(message.id)
                                          }
                                          if chat.isSending {
                                              HStack {
                                                  ProgressView()
                                                  Text("Thinking…").foregroundStyle(.secondary)
                                                  Spacer()
                                              }
                                              .padding(.horizontal)
                                          }
                                      }
                                      .padding(.vertical)
                                  }
                                  .onChange(of: chat.messages.count) { _ in
                                      if let id = chat.messages.last?.id {
                                          withAnimation { proxy.scrollTo(id, anchor: .bottom) }
                                      }
                                  }
                              }
                          }

                          Divider()
                          VStack(spacing: 8) {
                              if attachment.isLoading {
                                  HStack { ProgressView(); Text("Extracting attachment…"); Spacer() }
                                      .font(.caption)
                              } else if let item = attachment.current {
                                  AttachmentChip(item: item) { attachment.current = nil }
                              }

                              HStack(alignment: .bottom, spacing: 10) {
                                  Menu {
                                      PhotosPicker(selection: $photoItem, matching: .images) {
                                          Label("Photo Library", systemImage: "photo")
                                      }
                                      Button { showFileImporter = true } label: {
                                          Label("Choose File", systemImage: "doc")
                                      }
                                  } label: {
                                      Image(systemName: "paperclip.circle.fill")
                                          .font(.title2)
                                  }

                                  TextField("Message", text: $input, axis: .vertical)
                                      .lineLimit(1...5)
                                      .textFieldStyle(.roundedBorder)

                                  Button(action: send) {
                                      Image(systemName: "arrow.up.circle.fill")
                                          .font(.title)
                                  }
                                  .disabled(input.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty || chat.isSending || attachment.isLoading)
                              }
                              HStack {
                                  Text("\(settings.selectedProvider.shortTitle) • Today \(usage.total)/\(settings.localDailyLimit)")
                                      .font(.caption2)
                                      .foregroundStyle(.secondary)
                                  Spacer()
                              }
                          }
                          .padding(10)
                          .background(.ultraThinMaterial)
                      }
                      .navigationTitle("Chat / المحادثة")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button(role: .destructive) { chat.clear() } label: { Image(systemName: "trash") }
                                  .disabled(chat.messages.isEmpty)
                          }
                      }
                  }
                  .onChange(of: photoItem) { item in loadPhoto(item) }
                  .fileImporter(isPresented: $showFileImporter, allowedContentTypes: SupportedDocumentTypes.all, allowsMultipleSelection: false) { result in
                      switch result {
                      case .success(let urls): if let url = urls.first { loadFile(url) }
                      case .failure(let error): present(error.localizedDescription)
                      }
                  }
                  .alert("Error", isPresented: $showError) { Button("OK", role: .cancel) {} } message: { Text(errorMessage) }
              }

              private func send() {
                  let prompt = input.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !prompt.isEmpty else { return }
                  guard usage.canSend(limit: settings.localDailyLimit) else {
                      present("Your local daily limit is reached. Change it in Settings or wait until tomorrow.")
                      return
                  }
                  let history = chat.messages
                  let currentAttachment = attachment.current
                  input = ""
                  chat.messages.append(ChatMessage(role: .user, text: prompt))
                  chat.isSending = true

                  Task {
                      defer { chat.isSending = false }
                      do {
                          let result = try await AIService.shared.chat(
                              history: history,
                              prompt: prompt,
                              attachment: currentAttachment,
                              selected: settings.selectedProvider,
                              settings: settings
                          )
                          chat.messages.append(ChatMessage(role: .assistant, text: result.text, provider: result.provider.shortTitle))
                          usage.record(result.provider)
                      } catch {
                          present(error.localizedDescription)
                      }
                  }
              }

              private func loadPhoto(_ item: PhotosPickerItem?) {
                  guard let item else { return }
                  attachment.isLoading = true
                  Task {
                      defer { attachment.isLoading = false; photoItem = nil }
                      do {
                          guard let data = try await item.loadTransferable(type: Data.self),
                                let result = await DocumentExtractor.extractImageData(data) else {
                              throw ServiceError("Could not load photo")
                          }
                          attachment.current = result
                      } catch { present(error.localizedDescription) }
                  }
              }

              private func loadFile(_ url: URL) {
                  attachment.isLoading = true
                  Task {
                      defer { attachment.isLoading = false }
                      do {
                          let result = try await DocumentExtractor.extract(from: url)
                          attachment.current = InputAttachment(name: result.name, mimeType: result.mimeType, extractedText: result.text, imageData: result.imageData)
                      } catch { present(error.localizedDescription) }
                  }
              }

              private func present(_ message: String) {
                  errorMessage = message
                  showError = true
              }
          }

          struct MessageBubble: View {
              let message: ChatMessage

              var body: some View {
                  HStack {
                      if message.role == .user { Spacer(minLength: 45) }
                      VStack(alignment: .leading, spacing: 5) {
                          Text(message.text).textSelection(.enabled)
                          if let provider = message.provider {
                              Text(provider).font(.caption2).foregroundStyle(.secondary)
                          }
                      }
                      .padding(12)
                      .background(message.role == .user ? Color.indigo : Color(.secondarySystemBackground))
                      .foregroundStyle(message.role == .user ? Color.white : Color.primary)
                      .clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))
                      if message.role == .assistant { Spacer(minLength: 45) }
                  }
                  .padding(.horizontal)
              }
          }

